meta:
  engine: 4.1.0
  name: yggi_placa_L
  author: Yggi Keyboard
  version: rev0
units:
  kx: 18
  ky: 17
points:
  zones:
    big:
      anchor:
        shift: [kx/2, 0]
      key:
        padding: ky
        width: 2*kx
        column_net: COL0
      columns:
        c0:
      rows:
        r4:
          row_net: R4
        r3:
          row_net: R3
        r2:
          row_net: R2
    fixed:
      anchor:
        shift: [0, 3*ky]
      key:
        spread: kx
        padding: ky + 4.5
      columns:
        c0:
          key:
            column_net: COL0
        c1:
          key:
            column_net: COL1
      rows:
        r1:
          row_net: R1
        r0:
          row_net: R0
    bar:
      anchor:
        shift: [0, -ky]
      key:
        padding: ky
        row_net: R5
      columns:
        fn:
          key:
            column_net: COL0
        ctl:
          key:
            spread: kx
            column_net: COL1
        opt:
          key:
            spread: kx
            column_net: COL2
        cmd:
          key:
            spread: kx
            column_net: COL3
        del:
          key:
            spread: 22.5
            width: 1.5*kx
            column_net: COL4
        spc:
          key:
            spread: 27
            width: 1.5*kx
            column_net: COL5
      rows:
        r5:
outlines:
  board:
    - what: rectangle
      where: big_c0_r4
      adjust:
        shift: [0.0, 36.25]
      size: [35.4, 89.5]
    - what: rectangle
      where: big_c0_r4
      adjust:
        shift: [45.0, -17.15]
      size: [124, 14.7]
    - what: rectangle
      where: big_c0_r4
      adjust:
        shift: [0.34999999999999964, -9.1]
      size: [34.7, 1.6]
    - what: circle
      where: big_c0_r4
      adjust:
        shift: [4.0, 61.75]
      radius: 1.4
      operation: subtract
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
pcbs:
  placa_L:
    outlines:
      main:
        outline: board
    footprints:
      choc:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5.3]
      jout_0:
