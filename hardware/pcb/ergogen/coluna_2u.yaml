meta:
  engine: 4.1.0
  name: yggi_coluna_2u
  author: Yggi Keyboard
  version: rev0
units:
  kx: 18
  ky: 17
points:
  zones:
    matrix:
      key:
        spread: kx
        padding: ky
      columns:
        c1:
          key:
            column_net: C1
        c2:
          key:
            column_net: C2
            spread: 18
      rows:
        r4:
          row_net: R4
        r3:
          row_net: R3
        r2:
          row_net: R2
        r1:
          row_net: R1
          padding: ky + 4.5
        r0:
          row_net: R0
outlines:
  board:
    - what: rectangle
      where: matrix_c1_r4
      adjust:
        shift: [9.0, 36.25]
      size: [35.4, 89.5]
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
pcbs:
  coluna_2u:
    outlines:
      main:
        outline: board
    footprints:
      choc:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5.3]
      jin_0:
