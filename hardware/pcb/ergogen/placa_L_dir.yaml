meta:
  engine: 4.1.0
  name: yggi_placa_L_dir
  author: Yggi Keyboard
  version: rev0
units:
  kx: 18
  ky: 17
points:
  zones:
    big:
      anchor:
        shift: [-kx/2, 0]
      key:
        width: 2*kx
        column_net: COL0
      columns:
        c0:
      rows:
        r4:
          row_net: R4
    fixed:
      anchor:
        shift: [0, ky]
      key:
        spread: -kx
        padding: ky
      columns:
        c0:
          key:
            column_net: COL0
        c1:
          key:
            column_net: COL1
      rows:
        r3:
          row_net: R3
        r2:
          row_net: R2
        r1:
          row_net: R1
          padding: ky + 4.5
        r0:
          row_net: R0
    bar:
      anchor:
        shift: [-54, -ky]
      key:
        padding: ky
        row_net: R5
      columns:
        cmd:
          key:
            column_net: COL4
        ret:
          key:
            spread: -22.5
            width: 1.5*kx
            column_net: COL5
        spc:
          key:
            spread: -27
            width: 1.5*kx
            column_net: COL6
      rows:
        r5:
outlines:
  board:
    - what: rectangle
      where: big_c0_r4
      adjust:
        shift: [0.0, 36.25]
      size: [35.4, 89.5]
    - what: rectangle
      where: big_c0_r4
      adjust:
        shift: [-45.0, -17.15]
      size: [124, 14.7]
    - what: rectangle
      where: big_c0_r4
      adjust:
        shift: [-0.34999999999999964, -9.1]
      size: [34.7, 1.6]
    - what: circle
      where: big_c0_r4
      adjust:
        shift: [-4.0, 61.75]
      radius: 1.4
      operation: subtract
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
pcbs:
  placa_L_dir:
    outlines:
      main:
        outline: board
    footprints:
      choc:
        what: choc
        where: -/_r5$/
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: -/_r5$/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5.3]
      choc_bar:
        what: choc
        where: /_r5$/
        adjust:
          rotate: 180
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode_bar:
        what: diode
        where: /_r5$/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, 5.3]
